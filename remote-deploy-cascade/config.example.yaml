# Copy to config.yaml and adjust. Do not commit secrets (see .gitignore).
#
# One run can deploy:
# - exit node (S2),
# - entry node (S1),
# - cascade routing hooks.

source:
  mode: "git" # "git" | "local"
  git_url: "https://github.com/your-org/amnezia-wg-easy.git"
  branch: "master"
  # local_path: ".."

entry:
  ssh:
    host: "203.0.113.10"
    port: 22
    user: "root"
    identity_file: "~/.ssh/id_ed25519"
    # password: "secret"
    # ssh_password_env: "AMNEZIA_SSH_PASSWORD"
  remote:
    path: "/opt/amnezia-wg-easy-entry"
  env:
    WG_HOST: "203.0.113.10"
    PANEL_DOMAIN: "panel-entry.example.com"
    CERTBOT_EMAIL: "you@example.com"
    ADMIN_USERNAME: "admin"
    ADMIN_PASSWORD: "change-me-strong"
    LANGUAGE: "ru"
    WG_PORT: 51820
    PORT: 51821
    PANEL_HTTP_PORT: 80
    PANEL_HTTPS_PORT: 443
  network:
    # Optional: client ingress interface on entry host.
    # Leave unset to mark by source CIDR regardless of ingress interface.
    # vpn_ingress_interface: "amn0"
    # Dedicated inter-server WireGuard tunnel params (host namespace).
    cascade_interface: "wg-cascade"
    cascade_entry_ip: "172.31.255.1"
    cascade_exit_ip: "172.31.255.2"
    cascade_prefix_len: 30
    cascade_listen_port: 51830
    # Client subnets behind entry panel.
    client_cidrs:
      - "10.8.0.0/24"
    # Stay local on entry (peer/internal/LAN ranges), not through exit.
    local_cidrs:
      - "10.8.0.0/24"
      - "192.168.0.0/16"

exit:
  ssh:
    host: "198.51.100.20"
    port: 22
    user: "root"
    identity_file: "~/.ssh/id_ed25519"
    # password: "secret"
    # ssh_password_env: "AMNEZIA_SSH_PASSWORD"
  remote:
    path: "/opt/amnezia-wg-easy-exit"
  env:
    WG_HOST: "198.51.100.20"
    PANEL_DOMAIN: "panel-exit.example.com"
    CERTBOT_EMAIL: "you@example.com"
    ADMIN_USERNAME: "admin"
    ADMIN_PASSWORD: "change-me-strong"
    LANGUAGE: "ru"
    WG_PORT: 51820
    PORT: 51821
    PANEL_HTTP_PORT: 80
    PANEL_HTTPS_PORT: 443
  network:
    # Same tunnel params as entry.network (can be omitted if identical).
    cascade_interface: "wg-cascade"
    cascade_entry_ip: "172.31.255.1"
    cascade_exit_ip: "172.31.255.2"
    cascade_prefix_len: 30
    cascade_listen_port: 51830
    # Public/WAN interface on exit node for Internet egress.
    wan_interface: "eth0"
    # Must include all client subnets from entry.
    client_cidrs:
      - "10.8.0.0/24"
