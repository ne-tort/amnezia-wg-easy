# Copy to config.yaml and adjust. Do not commit secrets (see .gitignore).
#
# Architecture: S1 = full panel (awg0 + awg-cascade inside container); S2 = exit-core only
# (amneziavpn/amneziawg-go, interface exit-cascade). Orchestrator does not remove an old
# full panel on S2 — do that once by hand (see exit-core/README.md).

source:
  mode: "git" # "git" | "local"
  git_url: "https://github.com/your-org/amnezia-wg-easy.git"
  branch: "master"
  # local_path: ".."

entry:
  ssh:
    host: "203.0.113.10"
    port: 22
    user: "root"
    identity_file: "~/.ssh/id_ed25519"
    # password: "secret"
    # ssh_password_env: "AMNEZIA_SSH_PASSWORD"
  remote:
    path: "/opt/amnezia-wg-easy-entry"
  env:
    WG_HOST: "203.0.113.10"
    PANEL_DOMAIN: "panel-entry.example.com"
    CERTBOT_EMAIL: "you@example.com"
    ADMIN_USERNAME: "admin"
    ADMIN_PASSWORD: "change-me-strong"
    LANGUAGE: "ru"
    WG_PORT: 51820
    PORT: 51821
    PANEL_HTTP_PORT: 80
    PANEL_HTTPS_PORT: 443
  network:
    # Turn on second AmneziaWG interface (awg-cascade) and WG_CASCADE_* env in the panel.
    cascade_enabled: true
    cascade_entry_ip: "172.31.255.1"
    cascade_exit_ip: "172.31.255.2"
    cascade_prefix_len: 30
    cascade_listen_port: 51830
    # Optional; default is exit.ssh.host:cascade_listen_port
    # cascade_exit_endpoint: "198.51.100.20:51830"
    # Optional preseed (normally generated by install.py sync)
    # cascade_exit_public_key: "..."
    # Client VPN subnet(s) — must match panel; first CIDR is used in WG_CASCADE_CLIENT_SUBNET.
    client_cidrs:
      - "10.8.0.0/24"
    # Stay local on entry (peer/internal/LAN ranges), not through exit — host cleanup only.
    local_cidrs:
      - "10.8.0.0/24"
      - "192.168.0.0/16"

exit:
  # Required for cascade: minimal AmneziaWG stack (no panel .env).
  core: true
  # mode: core   # alternative to core: true
  ssh:
    host: "198.51.100.20"
    port: 22
    user: "root"
    identity_file: "~/.ssh/id_ed25519"
  remote:
    path: "/opt/amnezia-cascade-exit"
  network:
    cascade_listen_port: 51830
    # Public/WAN interface on exit host (NAT masquerade).
    wan_interface: "eth0"
    # Same client subnet(s) as entry.network.client_cidrs (for nft on exit).
    client_cidrs:
      - "10.8.0.0/24"
