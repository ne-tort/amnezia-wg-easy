# Copy to config.yaml and adjust. Do not commit secrets (see .gitignore).
#
# Пример доменов: entry WG_HOST/PANEL_DOMAIN = itvzlet.ai-qwerty.ru ; exit PANEL_DOMAIN = itvzlet2.ai-qwerty.ru
# (DNS A на публичные IP S1 и S2 до запуска Let's Encrypt).
#
# Architecture: S1 = full panel (awg0 + awg-cascade inside container) + nginx (80/443 TCP);
# S2 = exit-core: AmneziaWG (UDP, host network) + nginx TLS + certbot. UDP is not shared with nginx.
#
# Ports: use a custom WG_PORT on entry and cascade_listen_port (UDP on S2) distinct from each other
# (e.g. 5443 + 8443). TCP 80/443 are for Let's Encrypt and HTTPS only.

source:
  mode: "git" # "git" | "local"
  git_url: "https://github.com/your-org/amnezia-wg-easy.git"
  branch: "master"
  # local_path: ".."

entry:
  ssh:
    host: "203.0.113.10"
    port: 22
    user: "root"
    identity_file: "~/.ssh/id_ed25519"
  remote:
    path: "/opt/amnezia-wg-easy-entry"
  env:
    # Public endpoint for VPN clients (IP or DNS).
    WG_HOST: "vpn-entry.example.com"
    PANEL_DOMAIN: "vpn-entry.example.com"
    CERTBOT_EMAIL: "you@example.com"
    ADMIN_USERNAME: "admin"
    ADMIN_PASSWORD: "change-me-strong"
    LANGUAGE: "ru"
    WG_PORT: 5443
    PORT: 51821
    PANEL_HTTP_PORT: 80
    PANEL_HTTPS_PORT: 443
    # Panel UI under https://PANEL_DOMAIN/panel/ ; site root / can mirror an external HTTPS origin or a local URL.
    WEBUI_PUBLIC_PREFIX: "/panel"
    NGINX_ROOT_BEHAVIOR: "mirror"
    NGINX_MIRROR_HOST: "www.wikipedia.org"
    # NGINX_ROOT_BEHAVIOR: "local"
    # NGINX_LOCAL_URL: "http://172.17.0.1:8080/"
    # NGINX_ROOT_BEHAVIOR: "redirect"
  network:
    cascade_enabled: true
    cascade_entry_ip: "172.31.255.1"
    cascade_exit_ip: "172.31.255.2"
    cascade_prefix_len: 30
    cascade_listen_port: 8443
    client_cidrs:
      - "10.8.0.0/24"
    local_cidrs:
      - "10.8.0.0/24"
      - "192.168.0.0/16"

exit:
  core: true
  ssh:
    host: "198.51.100.20"
    port: 22
    user: "root"
    identity_file: "~/.ssh/id_ed25519"
  remote:
    path: "/opt/amnezia-cascade-exit"
  env:
    WG_HOST: "198.51.100.20"
    PANEL_DOMAIN: "vpn-exit.example.com"
    CERTBOT_EMAIL: "you@example.com"
    PANEL_HTTP_PORT: 80
    PANEL_HTTPS_PORT: 443
    NGINX_ROOT_BEHAVIOR: "mirror"
    NGINX_MIRROR_HOST: "www.wikipedia.org"
    # NGINX_ROOT_BEHAVIOR: "local"
    # NGINX_LOCAL_URL: "http://127.0.0.1:3000/"
  network:
    cascade_listen_port: 8443
    wan_interface: "eth0"
    client_cidrs:
      - "10.8.0.0/24"
