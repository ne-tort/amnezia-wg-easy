# One-off: deploy from local repo (no git push). Same hosts as deploy-runtime.yaml.
# Run: python remote-deploy-cascade/install.py -c remote-deploy-cascade/deploy-local.yaml …
# from repo root so local_path "." is the repository.
source:
  mode: "local"
  local_path: "."

entry:
  ssh:
    host: "93.88.203.24"
    port: 22
    user: "root"
    identity_file: "~/.ssh/myserver_key"
  remote:
    path: "/opt/amnezia-wg-easy-entry"
  env:
    WG_HOST: "93.88.203.24"
    PANEL_DOMAIN: "93.88.203.24"
    ADMIN_USERNAME: "admin"
    ADMIN_PASSWORD: "admin"
    WG_PORT: "5443"
    PORT: "51821"
    PANEL_HTTP_PORT: "80"
    PANEL_HTTPS_PORT: "8443"
    LANGUAGE: "ru"
  network:
    cascade_enabled: true
    cascade_entry_ip: "172.31.255.1"
    cascade_exit_ip: "172.31.255.2"
    cascade_prefix_len: 30
    cascade_listen_port: 8443
    client_cidrs:
      - "10.8.0.0/24"
    local_cidrs:
      - "10.8.0.0/24"

exit:
  core: true
  ssh:
    host: "89.125.17.164"
    port: 22
    user: "root"
    identity_file: "~/.ssh/myserver_key"
  remote:
    path: "/opt/amnezia-cascade-exit"
  network:
    cascade_listen_port: 8443
    wan_interface: "eth0"
    client_cidrs:
      - "10.8.0.0/24"
