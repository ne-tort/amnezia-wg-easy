# BROKEN / DO NOT USE for real deploys.
#
# Local (tar/rsync) mode is unreliable in this environment; servers do not consistently
# receive the workspace tree you expect. Use source.mode: "git" and push commits first
# (see deploy-runtime.yaml or config.example.yaml).
#
# Kept only as a stub so old docs/commands fail loudly — replace with git-based config.

source:
  mode: "local"
  local_path: "."

entry:
  ssh:
    host: "INVALID"
    port: 22
    user: "root"
    identity_file: "~/.ssh/myserver_key"
  remote:
    path: "/opt/amnezia-wg-easy-entry"
  env:
    WG_HOST: "127.0.0.1"
    PANEL_DOMAIN: "127.0.0.1"
    ADMIN_USERNAME: "admin"
    ADMIN_PASSWORD: "admin"
    WG_PORT: "5443"
    PORT: "51821"
    PANEL_HTTP_PORT: "80"
    PANEL_HTTPS_PORT: "8443"
    LANGUAGE: "ru"
  network:
    cascade_enabled: true
    cascade_entry_ip: "172.31.255.1"
    cascade_exit_ip: "172.31.255.2"
    cascade_prefix_len: 30
    cascade_listen_port: 8443
    client_cidrs:
      - "10.8.0.0/24"
    local_cidrs:
      - "10.8.0.0/24"

exit:
  core: true
  ssh:
    host: "INVALID"
    port: 22
    user: "root"
    identity_file: "~/.ssh/myserver_key"
  remote:
    path: "/opt/amnezia-cascade-exit"
  network:
    cascade_listen_port: 8443
    wan_interface: "eth0"
    client_cidrs:
      - "10.8.0.0/24"
