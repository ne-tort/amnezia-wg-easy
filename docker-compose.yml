# Amnezia WG-Easy — custom build (DPI patches, UI: no QR, Copy button)
# Run: ./deploy.sh or docker compose up -d --build

services:
  amnezia-dns:
    build:
      context: amnezia-dns
      dockerfile: Dockerfile
    image: amnezia-dns:local
    container_name: amnezia-dns
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"
    networks:
      amnezia-dns-net:
        ipv4_address: 172.29.172.254

  amnezia-wg-easy:
    build:
      context: .
      dockerfile: Dockerfile
    image: amnezia-wg-easy:local
    container_name: amnezia-awg
    env_file:
      - .env
    depends_on:
      - amnezia-dns
    ports:
      # VPN (UDP): host and container use same port so ListenPort in awg0.conf matches. Change via WG_PORT in .env.
      # Web UI is only via nginx (HTTPS) when nginx service is used; no direct TCP port exposure.
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    volumes:
      - amnezia-wg-data:/opt/amnezia/awg
      # * Mount host kernel modules so container can use amneziawg.ko if installed (same as Amnezia client).
      - /lib/modules:/lib/modules:ro
    restart: always
    # * Set to "none" to disable logs; use "json-file" (default) to read with docker logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - default
      - amnezia-dns-net

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    image: amnezia-wg-easy-nginx:local
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-panel.ai-qwerty.ru}
      PANEL_PORT: ${PORT:-51821}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - amnezia-wg-easy
    networks:
      - default

  certbot:
    build:
      context: certbot
      dockerfile: Dockerfile
    image: amnezia-wg-easy-certbot:local
    container_name: certbot
    env_file:
      - .env
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
    networks:
      - default

networks:
  amnezia-dns-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: amn0
    ipam:
      config:
        - subnet: 172.29.172.0/24

volumes:
  amnezia-wg-data:
  certbot_conf:
  certbot_www:
