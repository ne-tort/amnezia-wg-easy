# Amnezia WG-Easy — custom build (DPI patches, UI: no QR, Copy button)
# Run: ./deploy.sh or docker compose up -d --build

services:
  amnezia-wg-easy:
    build:
      context: .
      dockerfile: Dockerfile
    image: amnezia-wg-easy:local
    container_name: amnezia-wg-easy
    env_file:
      - .env
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "${PORT:-51821}:${PORT:-51821}/tcp"
    volumes:
      - amnezia-wg-data:/etc/amnezia/amneziawg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  amnezia-wg-data:
