# Amnezia WG-Easy — ./deploy.sh or: docker compose up -d --build
# Amnezia DNS / Xray / Mieru / Hysteria / Naive: optional containers via docker run (not compose services).
# Network amnezia-dns-net is created by deploy.sh; panel attaches as external.
# Extra nginx ports (panel HTTPS + SNI demux) come from docker-compose.ports.yml (portPlan).

services:
  amnezia-wg-easy:
    build:
      context: .
      dockerfile: Dockerfile
    image: amnezia-wg-easy:local
    container_name: amnezia-awg
    env_file:
      - .env
    ports:
      # VPN (UDP): host and container use same port so ListenPort in awg0.conf matches. Change via WG_PORT in .env.
      # Web UI is only via nginx (HTTPS) when nginx service is used; no direct TCP port exposure.
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    volumes:
      - amnezia-wg-data:/opt/amnezia/awg
      # * Mount host kernel modules so container can use amneziawg.ko if installed (same as Amnezia client).
      - /lib/modules:/lib/modules:ro
      # Panel manages amnezia-dns container via Docker when UI toggle is used.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host install dir: portPlan runs `docker compose` to recreate nginx (demux ports).
      - ${AWG_INSTALL_DIR:-/opt/amnezia-wg-easy}:${AWG_INSTALL_DIR:-/opt/amnezia-wg-easy}:rw
    restart: always
    # * Set to "none" to disable logs; use "json-file" (default) to read with docker logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - default
      - amnezia-dns-net

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    image: amnezia-wg-easy-nginx:local
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${PANEL_HTTP_PORT:-80}:80"
      # Panel HTTPS + demux ports: see docker-compose.ports.yml (generated by portPlan / deploy).
    environment:
      # Leave empty by default to allow self-signed cert to match WG_HOST in nginx entrypoint.
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      PANEL_PORT: ${PORT:-51821}
      PANEL_HTTPS_PORT: ${PANEL_HTTPS_PORT:-10123}
      NGINX_MIRROR_HTTPS_PORT: ${NGINX_MIRROR_HTTPS_PORT:-}
      WG_HOST: ${WG_HOST:-}
      NGINX_CONFIG_PROFILE: ${NGINX_CONFIG_PROFILE:-entry}
      WEBUI_PUBLIC_PREFIX: ${WEBUI_PUBLIC_PREFIX:-/panel}
      SUB_PUBLIC_PREFIX: ${SUB_PUBLIC_PREFIX:-/sub}
      NGINX_ROOT_BEHAVIOR: ${NGINX_ROOT_BEHAVIOR:-mirror}
      NGINX_MIRROR_HOST: ${NGINX_MIRROR_HOST:-}
      NGINX_LOCAL_URL: ${NGINX_LOCAL_URL:-}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
      # Stream SNI configs rewritten by panel portPlan.
      - amnezia-wg-data:/opt/amnezia/awg:rw
    depends_on:
      - amnezia-wg-easy
    networks:
      - default

  certbot:
    profiles:
      - letsencrypt
    build:
      context: certbot
      dockerfile: Dockerfile
    image: amnezia-wg-easy-certbot:local
    container_name: certbot
    env_file:
      - .env
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
    networks:
      - default

networks:
  # Same fixed name as Amnezia client (not project-prefixed).
  amnezia-dns-net:
    name: amnezia-dns-net
    external: true

volumes:
  amnezia-wg-data:
    name: amnezia-wg-easy_amnezia-wg-data
  # Created by install.sh (acme inject) / deploy.sh before up — not by Compose labels.
  certbot_conf:
    name: amnezia-wg-easy_certbot_conf
    external: true
  certbot_www:
    name: amnezia-wg-easy_certbot_www
    external: true
