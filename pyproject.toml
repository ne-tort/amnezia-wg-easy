[tool.poetry]
name = "python-signatures"
version = "0.1.0"
description = "Collectors for DNS/QUIC/STUN signatures used by amnezia-wg-easy"
authors = ["AmneziaWG Easy Maintainer <root@example.com>"]
packages = [
  { include = "python_signatures" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4"
pyyaml = "^6.0"
scapy = { version = "^2.7.0", python = ">=3.10,<4" }
# aioquic = "^1.0.0"  # for real QUIC capture (future)

# * Browser capture (Playwright + Chromium) — optional; not in Docker panel image (Alpine/musl).
#   poetry install --with capture   # enable browser profiles
[tool.poetry.group.capture]
optional = true

[tool.poetry.group.capture.dependencies]
browser-capture = { path = "browser_capture", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
dnspython = "^2.7.0"

[tool.pytest.ini_options]
testpaths = ["tests", "browser_capture/tests"]
pythonpath = ["."]
markers = [
    "integration: live network or tcpdump (skipped in default CI)",
]
addopts = "-ra"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

