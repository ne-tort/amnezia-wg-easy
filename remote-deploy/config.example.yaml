# Copy to config.yaml and adjust. Do not commit secrets (see .gitignore).

ssh:
  host: "203.0.113.10"
  port: 22
  user: "root"
  # Prefer key auth:
  identity_file: "~/.ssh/id_ed25519"
  # Or password (or use env: ssh_password_env below)
  # password: "secret"

  # If set, read SSH password from this environment variable on the operator machine
  # ssh_password_env: "AMNEZIA_SSH_PASSWORD"

source:
  mode: "git" # "git" | "local"
  git_url: "https://github.com/your-org/amnezia-wg-easy.git"
  branch: "master"
  # For mode: local — path to repo root (default: parent of remote-deploy/)
  # local_path: ".."

remote:
  path: "/opt/amnezia-wg-easy"

# Optional: document cascade / double-VPN intent for operators and --dry-run output.
# Does not change .env or run extra SSH steps. See docs/cascade-vpn-modes.md.
# topology:
#   mode: manual_site_to_site # manual_site_to_site | client_double_tunnel | single_exit_only | unspecified
#   entry:
#     host: "wg-entry.example.com"
#     wg_port: 51820
#   exit:
#     host: "wg-exit.example.net"
#     wg_port: 51820
#   notes: "Clients on entry only; exit provides internet egress."

# Merged into .env on the server (see ../.env.example for all keys).
# On every install.py run the remote .env is fully replaced — set WG_HOST here so
# the VPN Endpoint (WG_HOST:WG_PORT in client configs) matches your intent on reinstall.
# Use public IP or a DNS name (A/AAAA must point to this server). PANEL_DOMAIN is only
# for HTTPS to the panel; it does not set Endpoint unless you also put that name in WG_HOST.
env:
  # Endpoint host for AmneziaWG clients (not the panel URL by itself).
  WG_HOST: "203.0.113.10"
  PANEL_DOMAIN: "panel.example.com"
  CERTBOT_EMAIL: "you@example.com"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "change-me-strong"
  LANGUAGE: "ru"
  WG_PORT: 51820
  PORT: 51821
  # Host ports for nginx (maps to 80/443 inside container). Browser uses https://PANEL_DOMAIN:PANEL_HTTPS_PORT
  PANEL_HTTP_PORT: 80
  PANEL_HTTPS_PORT: 443
