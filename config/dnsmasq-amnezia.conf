# Amnezia DNS: dnsmasq in wg-easy forwards to amnezia-dns (Unbound) at 172.29.172.254.
# Matches pattern: VPN clients use DNS=10.8.0.1; dnsmasq forwards to 172.29.172.254 (amnezia-dns-net).
# listen on all so dnsmasq can start before wg0 (10.8.0.1) exists.
listen-address=0.0.0.0
port=53
no-resolv
no-hosts
no-poll
server=172.29.172.254

# Local name overrides (resolved by dnsmasq before forwarding to amnezia-dns)
address=/synology.vzlet/10.8.0.4
